        :root {

        .floating-text {

        .container {
            display: flex;

        .happy:hover {

        }

        .abhaya:hover {
            color: var(--abhaya);
        }

        .bg {
            z-index: -5;
            opacity: 50%;
            width: 100vw;
            height: 100vh;
            font-size: 0.1em;
            position: absolute;
            top: 0;
            display: flexbox;
            flex-direction: column;
        }

        .dance {
            font-size: 5em;
            text-align: center;
            margin-right: 2em;
            display: flex;
        }

        #color-palette a {
            font-size: 20px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: var(--alt-text);
            text-decoration: none;
            font-style: italic;
        }

        #color-palette a:hover {
            text-decoration: underline;
            transform: scale(1.02);
        }
